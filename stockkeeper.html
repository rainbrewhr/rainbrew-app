<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rainbrew Stock Keeper</title>
<meta name="theme-color" content="#2A1F1A">
<link rel="manifest" href="stockkeeper.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RB Stock">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html,body{margin:0;height:100%;background:#2A1F1A;overflow:hidden}
  #app{position:fixed;left:0;top:env(safe-area-inset-top,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:#fff}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;color:#2A1F1A;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  #load img{width:150px;height:150px}
  #load a{color:#1F5A6E;font-weight:700}
  #load.gone{display:none}
</style>
</head>
<body>
<!-- Rainbrew launcher: shows the Apps Script web app full screen so it can be saved to a phone like an app. -->
<iframe id="app" title="Rainbrew Stock Keeper" allow="clipboard-write"></iframe>
<div id="load"><img src="icon-192.png" alt=""><div>Opening Rainbrew Stock Keeper…</div><a id="direct" href="#" style="display:none">Taking too long? Open it directly</a></div>
<script src="config.js"></script>
<script>
  var BASE = (window.RAINBREW && window.RAINBREW.WEB_APP_URL) || '';   // set in config.js
  var APP = 'stockkeeper';
  var mobile = window.matchMedia('(max-width: 1024px)').matches || window.matchMedia('(pointer: coarse)').matches;
  var q = [];
  if (APP !== 'admin') q.push('app=' + APP);
  if (mobile) q.push('device=mobile');
  if (!BASE) { document.querySelector('#load div').textContent = 'Web app address is missing in config.js.'; throw new Error('config'); }
  var url = BASE + (q.length ? '?' + q.join('&') : '');
  var frame = document.getElementById('app'), load = document.getElementById('load'), direct = document.getElementById('direct');
  direct.href = url;
  frame.addEventListener('load', function () { load.className = 'gone'; });
  frame.src = url;
  setTimeout(function () { direct.style.display = 'inline'; }, 10000);
</script>
</body>
</html>
